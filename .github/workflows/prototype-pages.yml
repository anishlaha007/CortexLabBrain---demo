# Builds the Cortex prototype and publishes it with GitHub Pages at https://anishlaha007.github.io/CortexLabBrain---demo/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions". Then every push to main
# that touches prototype/ redeploys, and Actions → "Prototype on GitHub Pages" → Run workflow redeploys by hand.
name: Prototype on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['prototype/**', '.github/workflows/prototype-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
