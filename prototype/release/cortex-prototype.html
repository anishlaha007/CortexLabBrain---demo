ust joined`],[`new here`],[`where`,`start`],[`onboard`],[`new member`],[`new student`],[`what does this lab`]],text:`Welcome. The lab studies how animals and robots move through sand, mud and clutter, and uses robots as physical models to find the principles behind that movement [1]. The work falls into 11 topics, which you can see as the big nodes on the brain.

Mei’s notebook fits the same kind of force model to the lab’s newer glass beads [2].`,sources:[{node:`p-sandfish`,where:`Abstract`},{node:`f-rft-nb`,where:`cells 4–7`}]},{id:`diffraction`,hub:`posts`,title:`Why snakes scatter off posts`,q:`Why do snakes scatter off a row of posts?`,keys:[[`diffract`],[`post`],[`scatter`],[`snake`,`obstacle`]],text:`Snakes moving through a row of posts get turned into a few preferred directions. The pattern looks like waves diffracting through a grating [1].

They don’t change their body wave to avoid or grab the posts, and a model with no sensing at all reproduces the pattern. So the scattering comes from the body’s mechanics, not from decisions [1]. Kofi is choosing the post spacing for the next runs [2].`,sources:[{node:`p-diffract`,where:`Abstract`},{chat:`c-spacing`,where:`3 answers`}]},{id:`legs`,hub:`legs`,title:`Why many legs help on rough ground`,q:`Why do more legs help a robot on rough ground?`,keys:[[`leg`],[`centipede`],[`multileg`]],text:`Adding leg pairs lets a robot move reliably over rough, unpredictable ground without extra sensors, an idea the lab calls spatial redundancy [1]. A related study shows many-legged robots can even move by deliberately slipping, lifting and lowering their legs in a pattern it calls “frictional swimming” [2].

The work is the basis of Ground Control Robotics, a start-up building centipede-style robots for farms [3].`,sources:[{node:`p-multileg`,where:`Abstract`},{node:`p-slip`,where:`Abstract`},{node:`w-gcr`,where:`Article`}]},{id:`smarticles`,hub:`smarticles`,title:`Robots made of robots`,q:`What are smarticles, and how do they team up?`,keys:[[`smarticle`],[`robot made of robots`],[`blob`],[`swarm`]],text:`Smarticles are small 3D-printed robots that can only flap two arms. Five in a ring nudge each other and move as one “supersmarticle”, and adding a light sensor lets the group steer [1].

In the worm-blob work, blackworms tangled into a blob survived drying out for longer, and a mesh of smarticles showed similar group behaviour [2]. Ava is running the light-following trials now [3].`,sources:[{node:`p-smarticle`,where:`Abstract`},{node:`p-blobs`,where:`Abstract`},{chat:`c-lightblob`,where:`Ava is here now`}]},{id:`rover`,hub:`rovers`,title:`Getting a rover out of sand traps`,q:`How does the rover avoid getting stuck in sand?`,keys:[[`rover`],[`mars`],[`planet`],[`stuck`]],text:`The lab’s rover gets itself out of sand traps by mixing paddling, walking and wheel spinning, a gait the team called “rear rotator pedaling” [1]. Lucas is testing it on a steeper bed [2].`,sources:[{node:`p-rover`,where:`Abstract`},{chat:`c-pedal`,where:`5 answers`}]},{id:`mudskipper`,hub:`land`,title:`Tails and the first steps on land`,q:`How did tails help the first animals move on land?`,keys:[[`mudskipper`],[`tetrapod`],[`tail`],[`first`,`land`],[`muddybot`]],text:`Using the tail together with the front limbs would have helped early land animals a lot on sandy slopes [1]. The lab showed this with mudskippers and MuddyBot, a robot with two limbs and a powerful tail [1][2].`,sources:[{node:`p-tail`,where:`Abstract`},{node:`r-muddy`,where:`Robot card`}]},{id:`pivot`,hub:`legs`,title:`Idea: a centipede robot that weeds blueberries`,q:`Could a centipede robot weed under blueberry bushes?`,keys:[[`blueberr`],[`weed`],[`farm`],[`crop`]],text:`Promising. The lab’s many-legged robots move reliably over bumpy ground without extra sensing [1], and the spin-out Ground Control Robotics is aiming at this kind of specialty-crop work [2].

Priya already has a chat on a blueberry-row mockup. Pulling it in would give me her trial data.`,sources:[{node:`p-multileg`,where:`Abstract`},{node:`w-gcr`,where:`Article`}],suggest:{chat:`c-blueberry`,who:`priya`}},{id:`granular`,hub:`soft`,title:`What a granular medium is`,q:`What is a granular medium?`,keys:[[`granular`],[`what is sand`]],background:!0,text:`General background, not from the lab’s files: a granular medium is a collection of solid grains, like sand, soil or seeds. Depending on how it’s pushed, it can hold you up like a solid or pour like a liquid. That’s why moving through it is so hard to model.

e gets steeper, the snakes increase the length of their body in contact with the sand.`,`Giving a snake robot the same strategy let it climb slopes close to the steepest angle the sand can hold.`]},"p-tail":{url:`https://techxplore.com/news/2016-07-robot-animals-million-years.html`,summary:[`Mudskippers and MuddyBot, a robot with two limbs and a tail, are used as models of the first vertebrates moving onto land.`,`Coordinating the tail with the limbs greatly improves movement on slopes and sandy ground.`]},"p-review":{url:`https://www.arxiv.org/abs/1602.04712`,summary:[`A review arguing for “robophysics”: the search for principles of self-generated motion, using robots as physical models.`,`It sits at the meeting point of robotics, soft matter and dynamical systems.`]},"p-clog":{url:`https://qbios.gatech.edu/node/351`,summary:[`Fire ants and autonomous robots digging in narrow tunnels, alongside two computer models.`,`Digging is robustly optimised when some workers stay idle and others retreat, without any central control.`,`Up to three robots worked well in a narrow tunnel. A fourth caused a clog that stopped all work.`]},"p-diffract":{url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC6421434`,summary:[`A desert snake moving through an array of posts gets reoriented in a pattern reminiscent of wave diffraction.`,`The snakes didn’t change their body wave to avoid or grab the posts.`,`An open-loop model with no sensing reproduced the pattern, showing how passive dynamics help limbless animals cross cluttered ground.`]},"p-smarticle":{url:`https://www.nanowerk.com/news2/robotics/newsid=53630.php`,summary:[`“Smarticles” are 3D-printed robots that can only flap two arms.`,`Five confined in a ring form a “supersmarticle” that moves by itself.`,`Adding a light or sound sensor lets the group steer, well enough to get through a maze.`]},"p-rover":{url:`https://qbios.gatech.edu/node/291`,summary:[`A rover climbs loose slopes by combining paddling, walking and wheel spinning, called “rear rotator pedaling”.`,`Its behaviour is modelled with terradynamics. A Science Robotics cover article, supported by NASA and the Army Research Office.`]},"p-blobs":{url:`https://www.newswise.com/articles/collective-worm-and-robot-blobs-protect-individuals-swarm-together`,summary:[`California blackworms tangle into blobs that act together. Larger blobs survive drying out for longer.`,`Six smarticles with light sensors, pinned in a mesh, showed emergent behaviour similar to the worms.`]},"p-multileg":{url:`https://chemistry.gatech.edu/news/build-better-crawly-robot-add-legs-lots-legs`,summary:[`Robots inspired by centipedes, each with a different number of legs, tested on difficult ground.`,`Adding leg pairs makes movement robust over rough terrain without extensive sensing, an idea called spatial redundancy.`,`Uses include agriculture, space exploration and search and rescue.`]},"p-slip":{url:`https://arxiv.org/abs/2207.10604`,summary:[`On solid ground, legged robots usually avoid slipping. This work uses slipping on purpose.`,`Lifting and lowering added legs in a pattern creates “frictional swimming”, moving a meter-scale robot at about half a body length per second.`]},"p-mechint":{url:`https://arxiv.org/abs/2304.08652`,summary:[`A limbless robot bent left and right by two cables, with adjustable body compliance.`,`With the right compliance it moves more efficiently and gets through obstacles open-loop, without sensing its surroundings.`,`The authors call this passive help “mechanical intelligence”.`]},"p-geophase":{url:`https://arxiv.org/abs/2405.09696v1`,summary:[`A geometric framework for comparing the travelling waves used by limbless animals.`,`Nematode worms, desert snakes and lizards trace near-circular loops through two body “modes”.`,`Those loops enclose close to the most area possible, across organisms spanning two decades in body length.`]}},pi={"w-physworld":{outlet:`Physics World`,url:`https://physicsworld.com/a/slithering-snakes-diffract-like-quantum-particles/`,summary:`Coverage of the 2019 snake diffraction study: snakes moving through posts scatter like particles diffracting.`},"w-gcr":{outlet:`IEEE Spectrum`,url:`https://spectrum.ieee.org/ground-control-robot-insects`,summary:`Ground Control Robotics, an Atlanta start-up co-founded by Prof. Goldman, builds centipede-style robots to work under specialty crops like blueberries.`},"w-sciam":{outlet:`Scientific American`,url:`https://www.scientificamerican.com/blog/cocktail-party-physics/tunnel-vision-probing-the-physics-of-fire-ants`,summary:`A blog post on the physics of fire ants moving through their tunnels.`},"w-wiggly":{outlet:`Georgia Tech Research`,url:`https://research.gatech.edu/feature/wiggly-robots`,summary:`May 2024 feature: worms and snakes wiggle through varied terrain without learning it, and a limbless robot uses “mechanical intelligence” to do the same.`}},mi={"r-sandfish":{specs:[`Swims through granular media with a body wave`,`Modelled on the sandfish lizard`],paper:`p-sandfish`},"r-snake":{specs:[`16 joints, each turned 90° from the last`,`About 2 inches wide and 37 inches long`,`Built with Carnegie Mellon’s snake robot team`,`Climbed loose slopes up to about 20° once given the sidewinder’s strategy`],paper:`p-sidewind`},"r-trackway":{specs:[`An array of posts set in a sand-like bed`,`Used to measure how snakes scatter`],paper:`p-diffract`},"r-limbless":{specs:[`Bent left and right by two independently controlled cables`,`Adjustable body compliance`],paper:`p-mechint`},"r-centipede":{specs:[`Modular segments with leg pairs`,`Versions with different numbers of legs`,`More legs means robust movement over rough ground`],paper:`p-multileg`},"r-diggers":{specs:[`Autonomous robots digging in a narrow tunnel`,`Three dig well together, a fourth causes a clog`],paper:`p-clog`},"r-smarticle":{specs:[`3D-printed and battery powered`,`Motors, simple sensors and limited computing`,`Can do one thing: flap two arms`],paper:`p-smarticle`},"r-blob":{
